[package]
name = "volo_challenge"
version = "0.1.0"
description = "Volo screen-time accountability escrow"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "volo_challenge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# init-if-needed: Playground's build image has this feature enabled (v1's escrow ATA uses
# init_if_needed and built+deployed there). The feature is declared HERE only so a local
# `cargo check` sees the same language; Playground never receives Cargo.toml.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
