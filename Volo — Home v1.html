<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volo — Home v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEFE3;--fg:#10261B;--mut:#52665A;
--pt:#10261B;--tf:#173626;--tf2:#215039;--ln:#2E5942;--v:#D4FF00;--ch:#F1F0E6;--mu:#93AE9E;--sky:#8FD3FF;--am:#F5B335;--co:#FF6A4D;
--dsp:'Big Shoulders Display','Arial Narrow',sans-serif;--sans:'Schibsted Grotesk',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07120C;--fg:#F1F0E6;--mut:#93AE9E}}
:root[data-theme="dark"]{--bg:#07120C;--fg:#F1F0E6;--mut:#93AE9E}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans)}
header{max-width:640px;padding:44px 24px 0}
header h1{font:900 clamp(44px,9vw,76px)/.9 var(--dsp);letter-spacing:.005em}
header p{color:var(--mut);line-height:1.55;margin-top:14px;font-size:15px}
.row{display:flex;gap:32px;overflow-x:auto;padding:32px 24px 56px;scroll-snap-type:x mandatory}
figure{flex:none;scroll-snap-align:center;width:315px}
figcaption{margin-top:16px;font-size:13px;color:var(--mut);line-height:1.45}
figcaption b{display:block;color:var(--fg);font-size:14px;margin-bottom:2px}
.ph{zoom:.8333;width:360px;height:760px;border:9px solid #000;border-radius:48px;background:var(--pt);color:var(--ch);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 0 1.5px #25382d,0 40px 60px -30px rgba(0,0,0,.6)}
.sb{height:28px;padding:8px 24px 0;display:flex;justify-content:space-between;font:600 12px var(--sans);color:var(--mu);position:relative;z-index:3}
.bd{flex:1;padding:8px 16px 0;display:flex;flex-direction:column;min-height:0;position:relative}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.d{font-family:var(--dsp);font-weight:900;line-height:.9}
.r{display:flex;align-items:center;gap:12px}.g{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.st{display:inline-flex;align-items:center;gap:5px;font:700 14px var(--sans)}
.ok{color:var(--v)}.wr{color:var(--am)}
.btn{height:48px;padding:0 24px;border-radius:28px;background:var(--v);color:var(--pt);font:700 16px var(--sans);display:flex;align-items:center;justify-content:center;gap:8px}
.nav{height:80px;background:var(--tf);display:flex;justify-content:space-around;padding-top:12px;font:600 12px var(--sans);color:var(--mu)}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px}
.nav u{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;text-decoration:none}
.nav .on{color:var(--ch)}.nav .on u{background:var(--v);color:var(--pt)}
.fx{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--ln)}
.ap{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font:800 14px var(--sans);color:#fff;flex:none}
.mini{position:relative;height:6px;border-radius:3px;background:var(--tf2);margin-top:12px}
.mini b{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--pt);animation:mv 1.3s .3s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes mv{from{left:0}}
.rule{border:0;border-top:1px solid var(--ln);margin:0}
.rec{display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid var(--ln);font-size:14px}
.rec:last-child{border:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<header>
<h1>TODAY, NOT THE LIST.</h1>
<p>Home v1: one hero clock (total allowance left today), exposure as one figure, the single duel that needs you, then record. No tabs, no FAB, no second fixtures list. Taps go to Duels.</p>
</header>
<div class="row" id="row"></div>
<script>
var P={bolt:'M13 2L4 14h6l-1 8 9-12h-6z',stats:'M5 20v-9M12 20V4M19 20v-6',user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1-5 4-7 8-7s7 2 8 7',home:'M4 11l8-7 8 7M6 9.5V20h12V9.5',ck:'M5 12.5l4.5 4.5L19 7.5',al:'M12 4l9.5 16.5h-19zM12 10v4.5M12 17.6v.01'};
function ic(n,s){s=s||24;return '<svg class="i" width="'+s+'" height="'+s+'" viewBox="0 0 24 24"><path d="'+P[n]+'"/></svg>'}
function sb(){return '<div class="sb"><span>9:41</span><span>5G 82%</span></div>'}
function nav(a){return '<div class="nav">'+[['Home','home'],['Duels','bolt'],['Stats','stats'],['Profile','user']].map(function(x){return '<div'+(x[0]==a?' class="on"':'')+'><u>'+ic(x[1])+'</u>'+x[0]+'</div>'}).join('')+'</div>'}

var s1='<div class="ph">'+sb()+'<div class="bd">'
+'<div style="padding:16px 0 4px"><div class="d" style="font-size:40px">TODAY</div><div class="mu" style="margin-top:6px;font-size:14px">Tue 12 May · 2 live duels</div></div>'
+'<div style="padding:8px 0 12px"><div class="d ok" style="font-size:60px">42:38</div><div class="mu" style="font-size:14px;margin-top:4px">left today across 2 duels</div></div>'
+'<hr class="rule"><div class="r" style="padding:12px 0"><div class="g"><div class="d" style="font-size:36px">$35</div><div class="mu" style="font-size:14px;margin-top:2px">on the line · settles midnight UTC</div></div></div><hr class="rule">'
+'<div class="mu" style="font-size:12px;font-weight:600;margin:16px 0 0">ENDING SOON</div>'
+'<div class="fx" style="border:0;padding-top:8px"><div class="ap" style="background:#000;box-shadow:inset 0 0 0 1.5px var(--ln)">TT</div><div class="g"><div style="font:700 16px var(--sans)">vs alex.skr</div><div class="mu" style="font-size:14px">TikTok, 30 min a day</div><div class="st ok" style="margin-top:6px">'+ic('ck',14)+'Ahead by 6 min</div><div class="mini"><b style="left:calc(42% - 6px);background:var(--v)"></b><b style="left:calc(62% - 6px);background:var(--sky)"></b></div></div><div style="width:76px;text-align:right;flex:none"><div class="d" style="font-size:36px">$10</div><div class="mu" style="font-size:14px">11 min left</div></div></div>'
+'<div class="btn" style="height:56px;font-size:17px;margin-top:12px">Open live duel</div>'
+'<hr class="rule" style="margin-top:8px">'
+'<div style="margin-top:4px"><div class="rec"><span>Streak</span><b>5 days</b></div><div class="mu" style="font-size:12px;font-weight:600;margin:12px 0 0">LAST SETTLED</div><div class="rec"><span>Mon · vs marcus.skr</span><b class="ok">Won +$5</b></div><div class="rec"><span>Sun · vs jay.skr</span><b style="color:var(--co)">Lost −$5</b></div></div>'
+'</div>'+nav('Home')+'</div>';

document.getElementById('row').innerHTML='<figure>'+s1+'<figcaption><b>Home</b>Hero is the total clock (42:38), not a list. Exposure is one figure ($35). One strip for the duel ending soonest, with a volt Open button as its single action. Streak plus the last two settled results inline; full history lives in Settled. Nav shows the new four: Home, Duels, Stats, Profile.</figcaption></figure>';
</script>
</body>
</html>
